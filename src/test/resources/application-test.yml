server:
  shutdown: immediate

management.endpoint:
  health.cache.time-to-live: 0
  info.cache.time-to-live: 0

hmpps-auth:
  url: "http://localhost:8090/auth"

prison-api:
  url: "http://localhost:8091"

case-notes-api:
  url: "http://localhost:8092"

prisoner-search:
  url: "http://localhost:8093"

locations-inside-prison-api:
  url: "http://localhost:8095"

system:
  client:
    id: test-client-id
    secret: test-client-secret

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Used when a Postgres is already listening on 5432 (e.g. docker compose up). When there is not,
# TestBase starts a container and overrides these with its details.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/change_someones_cell?sslmode=prefer
    username: change_someones_cell
    password: change_someones_cell
    hikari:
      pool-name: CSC-API-DB-CP
      maximum-pool-size: 10
